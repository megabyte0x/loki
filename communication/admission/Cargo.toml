[package]
name = "loki-setup-admission"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
loki-http-ingress = { path = "../ingress" }
loki-relay-protocol = { path = "../protocol" }
loki-relay-client = { path = "../client" }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "=1.54.0", features = ["macros", "rt-multi-thread", "sync", "net", "time", "signal"] }
rusqlite = { version = "=0.37.0", features = ["bundled"] }
ed25519-dalek = "=2.2.0"
base64 = "=0.22.1"
hex = "=0.4.3"
zeroize = "=1.8.2"
sha2 = "=0.10.9"
getrandom = "=0.4.3"

[dev-dependencies]
tower = { version = "=0.5.3", features = ["util"] }
loki-relay-server = { path = "../relay" }
