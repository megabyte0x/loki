name: repro

# Build the native and wasm signers twice, from two checkouts at different paths, and fail
# if the native hash or the signer server's complete bundle manifest differs.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repro:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: a
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: b
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: rustup toolchain install 1.95.0 --profile minimal --target wasm32-unknown-unknown
      - run: cargo +1.95.0 install wasm-pack --version 0.15.1 --locked
      - run: a/core/scripts/repro-build.sh > a.manifest
      - run: b/core/scripts/repro-build.sh > b.manifest
      - run: cat a.manifest && diff -u a.manifest b.manifest
